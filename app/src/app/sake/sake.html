<mat-tab-group>
  <mat-tab label="Summary">
    @if(generateFavorite() == null) {
      <sake-summary [data]="data()"></sake-summary>
    } @else {
      <sake-generated-summary [data]="generateFavorite()"></sake-generated-summary>
    }
  </mat-tab>
  <mat-tab label="Vector">
    <sake-vector ></sake-vector>
  </mat-tab>
</mat-tab-group>
